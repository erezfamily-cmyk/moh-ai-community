[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moh-ai-community"
version = "0.0.1"
description = "Local-first foundation for the Moh AI editorial workspace"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
moh-ai = "moh_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
